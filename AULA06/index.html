<body>
  <!-- A semãntica no html significa usar as tags certas para cada tipo de conteudo, ajudando navegadores, mecanismos de busca e leitores de tela a entenderem a melhor a estrutura da página -->     -->
<!-- Beneficiops do HTML Semántico -->
 <!-- 
Melhor a acessibilidade (Leitores de tela conseguem interpretar melhor)
Melhora o SEO ( O Google entende melhor a estrutura do site )
Facilita a manutenção do código (código mais organidado e legível)
Ajuda na responsividade (tags semãnticas tranbalham melhor com CSS E JS)
 -->

 <!-- SEM SEMÃNTICA -->
  <a href="#">Ínicio</a>
  <a href="#">sobre</a>
  <p>Texto principal do site</p>
  <p>Todos direitos reservados</p>

  <!-- HTML SEMÃNTICA -->
<HEader>
    <!-- O TOPO DO SITE OU DE UMA SEÇÃO (logo , titulo e menu de navegação) -->
   <nav>
    <!-- Contém links de navegação para outras partes do site -->
    <a href="">Ínicio</a>
    <a href="">sobre</a>
   </nav>
</HEader>
<main>
    <!-- Cotém o conteúdo principal da página -->
     <h1>Noticias ao vivo do sesi</h1>

     <section>
    <!-- Usada para agrupar conteudos relacinados dentro de uma pagina, geralmente com um titulo, indicando que fazem parte de um tema especifico -->
     <h2> Ultimas Noticias </h2>
     <p>Hoje foi anunciado um novo projeto</p>
     </section>
 
</main>
<footer>
    <p>TODOS OS DIREITOS RESERVADOS</p>
</footer>


</body>
</html>
