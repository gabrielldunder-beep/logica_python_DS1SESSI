<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AULA06</title>

</head>
<body>
  <!-- A semãntica no html significa usar as tags certas para cada tipo de conteudo, ajudando navegadores, mecanismos de busca e leitores de tela a entenderem a melhor a estrutura da página -->
<!-- Beneficiops do HTML Semántico -->
 <!---
Melhor a acessibilidade (Leitores de tela conseguem interpretar melhor)
Melhora o SEO ( O Google entende melhor a estrutura do site )
Facilita a manutenção do código (código mais organidado e legível)
Ajuda na responsividade (tags semãnticas tranbalham melhor com CSS E JS)
 -->

 <!-- SEM SEMÃNTICA 
  <a href="#">Ínicio</a>
  <a href="#">sobre</a>
  <p>Texto principal do site</p>
  <p>Todos direitos reservados</p>
-->

  <!-- HTML SEMÃNTICA -->
<HEader>
    <!-- O TOPO DO SITE OU DE UMA SEÇÃO (logo , titulo e menu de navegação) -->
   <nav>
    <!-- Contém links de navegação para outras partes do site -->
    <a href="">Ínicio</a>
    <a href="">sobre</a>
   </nav>
</HEader>
<main>
    <!-- Cotém o conteúdo principal da página -->
     <h1>Noticias ao vivo do sesi</h1>

     <section>
    <!-- Usada para agrupar conteudos relacinados dentro de uma pagina, geralmente com um titulo, indicando que fazem parte de um tema especifico -->
     <h2> Ultimas Noticias </h2>
     <p>Hoje foi anunciado um novo projeto</p>
    <article>
            <!-- Representa um conteúdo independente e autocontido, que pode ser distribuido ou reutilizado separadamente sem perder o sentido. Ex: Postagens Blog, Noticias, comentários de usuários, Cards de produtos, ou artigos de revistas, ... -->
          <h3>OS alunos amam ir para o senai </h3>
          <p>Descrição.....</p>
    </article> 
    </section>
    <aside>
        <!-- Tag usada para conteúdos secúndarios ou complementares, que não fazem parte do fluxo principal do documento. Normalmente, ela aparece como: 
         -Barras Laterais
         -Informaçães Adicionais
         -Anúncios
         -->
     <h3>Videos recomendados</h3>
     <ul>
        <li>como programar em HTML</li>
        </ul>
    </aside>

    <footer>
      <!-- Representação o rodapé da página, contendo informações como copyright e links secundários 
       Quando usar ?
       -final da página
    -->
       <p>👌 2026 Facebook - Todos os direitos reservados</p>
    </footer> 
    

 
</main>
<footer>
    <p>TODOS OS DIREITOS RESERVADOS</p>
</footer>


</body>
</html>
